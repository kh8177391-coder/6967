<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllCalc | Smart Calculators</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma;background:#f3f6fb;color:#172033}
header{background:linear-gradient(120deg,#10264d,#2563eb);color:white;padding:28px 5%}
header h1{font-size:34px;margin:0 0 8px}
header p{margin:0;color:#dbeafe}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px}
button{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:bold}
.lang{background:white;color:#17418c}
main{max-width:1200px;margin:25px auto;padding:0 16px}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;margin-bottom:17px;font-size:16px}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cat{background:#e3eaf5;color:#253b60}
.cat.active{background:#2563eb;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:white;border:1px solid #e5eaf2;border-radius:15px;padding:18px;box-shadow:0 4px 14px #00000008}
.card h3{margin:0 0 8px;font-size:18px}
.card p{font-size:13px;color:#64748b;min-height:30px}
.field{margin:10px 0}
label{display:block;font-size:13px;margin-bottom:5px;color:#526078}
input{width:100%;padding:11px;border:1px solid #dce3ed;border-radius:8px;font-size:15px}
.calc{width:100%;background:#2563eb;color:white;margin-top:10px}
.result{display:none;margin-top:12px;padding:13px;background:#eff6ff;color:#17418c;border-radius:9px;font-weight:bold;overflow-wrap:anywhere}
footer{text-align:center;padding:30px;color:#64748b}
@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<header>
<div class="top">
<div>
<h1>AllCalc</h1>
<p id="subtitle">أدوات حسابية للأعمال والحياة اليومية</p>
</div>
<button class="lang" onclick="toggleLanguage()" id="langButton">English</button>
</div>
</header>

<main>
<input class="search" id="search" placeholder="ابحث عن حاسبة..." oninput="render()">
<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>
</main>

<footer id="footer">AllCalc — حاسبات عملية للأعمال والاستخدام اليومي.</footer>

<script>
let language="ar";
let category="all";

const categories={
all:["الكل","All"],
business:["الشركات والأعمال","Business"],
money:["المال والمحاسبة","Money"],
trade:["التجارة والمبيعات","Trade"],
work:["العمل والرواتب","Work"],
daily:["الحياة اليومية","Daily Life"],
home:["المنزل والسيارات","Home & Cars"]
};

const calculators=[
{c:"business",ar:"صافي الربح",en:"Net Profit",d:"حساب صافي الربح بعد المصروفات.",f:[["revenue","الإيرادات","Revenue",20000],["expenses","المصروفات","Expenses",12000]],fn:v=>v.revenue-v.expenses},
{c:"business",ar:"هامش الربح",en:"Profit Margin",d:"نسبة الربح من سعر البيع.",f:[["cost","التكلفة","Cost",100],["price","سعر البيع","Selling Price",150]],fn:v=>(v.price-v.cost)/v.price*100+"%"},
{c:"business",ar:"نقطة التعادل",en:"Break-even Point",d:"عدد الوحدات اللازمة لتغطية التكاليف.",f:[["fixed","التكاليف الثابتة","Fixed Costs",5000],["price","سعر البيع للوحدة","Selling Price",100],["variable","تكلفة الوحدة","Variable Cost",60]],fn:v=>v.fixed/(v.price-v.variable)+" وحدة"},
{c:"business",ar:"العائد على الاستثمار",en:"ROI Calculator",d:"حساب نسبة العائد على الاستثمار.",f:[["gain","قيمة الاستثمار النهائية","Final Value",15000],["cost","التكلفة الأصلية","Initial Cost",10000]],fn:v=>(v.gain-v.cost)/v.cost*100+"%"},
{c:"business",ar:"إجمالي الربح",en:"Gross Profit",d:"المبيعات ناقص تكلفة البضاعة.",f:[["sales","المبيعات","Sales",20000],["cost","تكلفة البضاعة","Cost of Goods",12000]],fn:v=>v.sales-v.cost},
{c:"business",ar:"نسبة المصروفات",en:"Expense Ratio",d:"المصروفات كنسبة من الإيرادات.",f:[["expenses","المصروفات","Expenses",4000],["revenue","الإيرادات","Revenue",16000]],fn:v=>v.expenses/v.revenue*100+"%"},
{c:"business",ar:"حساب العمولة",en:"Commission Calculator",d:"حساب العمولة على المبيعات.",f:[["sales","قيمة المبيعات","Sales",10000],["rate","نسبة العمولة %","Commission %",5]],fn:v=>v.sales*v.rate/100},
{c:"business",ar:"نسبة النمو",en:"Growth Rate",d:"مقارنة القيمة الجديدة بالقديمة.",f:[["old","القيمة القديمة","Old Value",100],["new","القيمة الجديدة","New Value",125]],fn:v=>(v.new-v.old)/v.old*100+"%"},
{c:"money",ar:"حساب الضريبة",en:"Tax Calculator",d:"إضافة الضريبة إلى المبلغ.",f:[["amount","المبلغ","Amount",1000],["rate","نسبة الضريبة %","Tax Rate %",14]],fn:v=>"الضريبة: "+v.amount*v.rate/100+" — الإجمالي: "+v.amount*(1+v.rate/100)},
{c:"money",ar:"إزالة الضريبة",en:"Remove Tax",d:"استخراج الضريبة من مبلغ شامل لها.",f:[["amount","المبلغ شامل الضريبة","Tax Included",1140],["rate","نسبة الضريبة %","Tax Rate %",14]],fn:v=>"قبل الضريبة: "+v.amount/(1+v.rate/100)},
{c:"money",ar:"حساب الخصم",en:"Discount Calculator",d:"السعر النهائي بعد الخصم.",f:[["price","السعر الأصلي","Original Price",500],["discount","نسبة الخصم %","Discount %",20]],fn:v=>v.price*(1-v.discount/100)},
{c:"money",ar:"الفائدة البسيطة",en:"Simple Interest",d:"حساب الفائدة خلال عدد من السنوات.",f:[["amount","أصل المبلغ","Principal",10000],["rate","الفائدة السنوية %","Annual Rate %",10],["years","عدد السنوات","Years",2]],fn:v=>v.amount*v.rate/100*v.years},
{c:"money",ar:"القسط الشهري",en:"Monthly Installment",d:"حساب القسط بدون فوائد.",f:[["amount","المبلغ","Amount",12000],["months","عدد الشهور","Months",12]],fn:v=>v.amount/v.months},
{c:"money",ar:"تقسيم الفاتورة",en:"Split Bill",d:"تقسيم الفاتورة بين الأشخاص.",f:[["total","إجمالي الفاتورة","Total Bill",1000],["people","عدد الأشخاص","People",4]],fn:v=>v.total/v.people},
{c:"money",ar:"النسبة المئوية",en:"Percentage Calculator",d:"حساب نسبة من مبلغ.",f:[["amount","المبلغ","Amount",2500],["rate","النسبة %","Percentage %",15]],fn:v=>v.amount*v.rate/100},
{c:"trade",ar:"سعر البيع بعد إضافة الربح",en:"Selling Price",d:"تحديد سعر البيع من التكلفة وهامش الربح.",f:[["cost","تكلفة المنتج","Product Cost",100],["profit","نسبة الربح %","Profit %",30]],fn:v=>v.cost*(1+v.profit/100)},
{c:"trade",ar:"متوسط سعر الشراء",en:"Average Purchase Price",d:"حساب متوسط تكلفة المشتريات.",f:[["q1","الكمية الأولى","Quantity 1",10],["p1","السعر الأول","Price 1",20],["q2","الكمية الثانية","Quantity 2",15],["p2","السعر الثاني","Price 2",18]],fn:v=>(v.q1*v.p1+v.q2*v.p2)/(v.q1+v.q2)},
{c:"trade",ar:"قيمة المخزون",en:"Inventory Value",d:"حساب قيمة المنتجات الموجودة.",f:[["quantity","عدد الوحدات","Quantity",100],["cost","تكلفة الوحدة","Unit Cost",25]],fn:v=>v.quantity*v.cost},
{c:"trade",ar:"إجمالي الفاتورة",en:"Invoice Total",d:"حساب الفاتورة مع الخصم والضريبة.",f:[["quantity","الكمية","Quantity",3],["price","سعر الوحدة","Unit Price",250],["discount","الخصم %","Discount %",10],["tax","الضريبة %","Tax %",14]],fn:v=>v.quantity*v.price*(1-v.discount/100)*(1+v.tax/100)},
{c:"trade",ar:"تكلفة الشحن للوحدة",en:"Shipping Per Item",d:"توزيع تكلفة الشحن على المنتجات.",f:[["shipping","تكلفة الشحن","Shipping Cost",600],["quantity","عدد المنتجات","Items",30]],fn:v=>v.shipping/v.quantity},
{c:"work",ar:"الأجر بالساعة",en:"Hourly Wage",d:"حساب قيمة ساعة العمل.",f:[["salary","الراتب","Salary",6000],["hours","ساعات العمل","Hours",192]],fn:v=>v.salary/v.hours},
{c:"work",ar:"أجر العمل الإضافي",en:"Overtime Pay",d:"حساب أجر الساعات الإضافية.",f:[["hourly","الأجر بالساعة","Hourly Wage",30],["hours","الساعات الإضافية","Extra Hours",8],["factor","معامل الإضافي","Multiplier",1.5]],fn:v=>v.hourly*v.hours*v.factor},
{c:"work",ar:"ساعات العمل",en:"Work Hours",d:"حساب عدد ساعات العمل.",f:[["days","عدد الأيام","Days",22],["hours","ساعات اليوم","Hours Per Day",8]],fn:v=>v.days*v.hours+" ساعة"},
{c:"work",ar:"الراتب بعد الخصم",en:"Salary After Deduction",d:"حساب الراتب بعد خصم نسبة.",f:[["salary","الراتب الأساسي","Basic Salary",8000],["deduction","نسبة الخصم %","Deduction %",10]],fn:v=>v.salary*(1-v.deduction/100)},
{c:"work",ar:"الراتب مع الزيادة",en:"Salary Increase",d:"حساب الراتب بعد زيادة.",f:[["salary","الراتب الحالي","Current Salary",6000],["increase","نسبة الزيادة %","Increase %",15]],fn:v=>v.salary*(1+v.increase/100)},
{c:"daily",ar:"حساب العمر",en:"Age Calculator",d:"حساب العمر بالسنوات من تاريخ الميلاد.",f:[["birth","سنة الميلاد","Birth Year",2005]],fn:v=>new Date().getFullYear()-v.birth+" سنة"},
{c:"daily",ar:"استهلاك الكهرباء",en:"Electricity Cost",d:"حساب تكلفة استهلاك جهاز كهربائي.",f:[["watts","قدرة الجهاز بالوات","Power Watts",1000],["hours","ساعات التشغيل يوميًا","Hours Per Day",5],["days","عدد الأيام","Days",30],["price","سعر الكيلووات","Price Per KWh",1.5]],fn:v=>v.watts/1000*v.hours*v.days*v.price},
{c:"daily",ar:"استهلاك الوقود",en:"Fuel Consumption",d:"حساب استهلاك الوقود لكل 100 كم.",f:[["fuel","اللترات المستهلكة","Fuel Used",40],["distance","المسافة كم","Distance KM",500]],fn:v=>v.fuel/v.distance*100+" لتر/100 كم"},
{c:"daily",ar:"تكلفة رحلة السيارة",en:"Trip Cost",d:"حساب تكلفة الوقود للرحلة.",f:[["distance","المسافة كم","Distance KM",200],["consumption","لتر لكل 100 كم","Litres Per 100 KM",7],["price","سعر اللتر","Price Per Litre",15]],fn:v=>v.distance*v.consumption/100*v.price},
{c:"daily",ar:"مساحة الغرفة",en:"Room Area",d:"حساب مساحة الغرفة.",f:[["length","الطول بالمتر","Length M",5],["width","العرض بالمتر","Width M",4]],fn:v=>v.length*v.width+" متر مربع"},
{c:"daily",ar:"تحويل الوزن",en:"Weight Converter",d:"تحويل الكيلوجرام إلى رطل.",f:[["weight","الوزن بالكيلوجرام","Weight KG",10]],fn:v=>v.weight*2.20462+" lb"},
{c:"daily",ar:"تحويل الطول",en:"Length Converter",d:"تحويل المتر إلى قدم.",f:[["length","الطول بالمتر","Length M",2]],fn:v=>v.length*3.28084+" ft"},
{c:"daily",ar:"تحويل الحرارة",en:"Temperature Converter",d:"تحويل المئوية إلى فهرنهايت.",f:[["temp","الحرارة مئوية","Celsius",25]],fn:v=>v.temp*9/5+32+" °F"},
{c:"daily",ar:"وقت تحميل ملف",en:"Download Time",d:"تقدير وقت تنزيل ملف.",f:[["size","حجم الملف ميجابايت","File Size MB",1000],["speed","سرعة الإنترنت Mbps","Speed Mbps",50]],fn:v=>v.size*8/v.speed/60+" دقيقة"},
{c:"daily",ar:"تحويل العملة بسعر يدوي",en:"Currency Converter",d:"أدخل سعر الصرف بنفسك.",f:[["amount","المبلغ","Amount",100],["rate","سعر الصرف","Exchange Rate",50]],fn:v=>v.amount*v.rate},
{c:"daily",ar:"حساب الإكرامية",en:"Tip Calculator",d:"حساب الإكرامية وإجمالي الفاتورة.",f:[["bill","قيمة الفاتورة","Bill",500],["rate","الإكرامية %","Tip %",10]],fn:v=>"الإكرامية: "+v.bill*v.rate/100+" — الإجمالي: "+v.bill*(1+v.rate/100)},
{c:"home",ar:"تكلفة الدهان",en:"Paint Calculator",d:"تقدير كمية الدهان المطلوبة.",f:[["area","المساحة متر مربع","Area M2",50],["coverage","تغطية اللتر متر مربع","Coverage",10],["coats","عدد الأوجه","Coats",2]],fn:v=>v.area*v.coats/v.coverage+" لتر"},
{c:"home",ar:"تكلفة الوقود الشهرية",en:"Monthly Fuel Cost",d:"تقدير مصروف الوقود الشهري.",f:[["distance","المسافة اليومية كم","Daily KM",40],["consumption","الاستهلاك لكل 100 كم","Consumption",8],["price","سعر اللتر","Price",15],["days","أيام الاستخدام","Days",26]],fn:v=>v.distance*v.days*v.consumption/100*v.price},
{c:"home",ar:"حساب مساحة الأرض",en:"Land Area",d:"حساب مساحة الأرض بالمتر المربع.",f:[["length","الطول بالمتر","Length",20],["width","العرض بالمتر","Width",15]],fn:v=>v.length*v.width+" م²"},
{c:"home",ar:"تكلفة استهلاك المياه",en:"Water Cost",d:"حساب تكلفة استهلاك المياه.",f:[["amount","الاستهلاك بالمتر المكعب","Usage M3",20],["price","سعر المتر المكعب","Price Per M3",5]],fn:v=>v.amount*v.price}
];

function render(){
document.documentElement.lang=language;
document.documentElement.dir=language==="ar"?"rtl":"ltr";
document.getElementById("subtitle").textContent=language==="ar"?"أدوات حسابية للأعمال والحياة اليومية":"Calculators for business and everyday life";
document.getElementById("langButton").textContent=language==="ar"?"English":"العربية";
document.getElementById("search").placeholder=language==="ar"?"ابحث عن حاسبة...":"Search calculators...";
document.getElementById("footer").textContent=language==="ar"?"AllCalc — حاسبات عملية للأعمال والاستخدام اليومي.":"AllCalc — Practical business and everyday calculators.";

document.getElementById("categories").innerHTML=Object.entries(categories).map(([k,v])=>
`<button class="cat ${category===k?"active":""}" onclick="setCategory('${k}')">${v[language==="ar"?0:1]}</button>`).join("");

let query=document.getElementById("search").value.toLowerCase();
let list=calculators.filter(x=>(category==="all"||x.c===category)&&
(x.ar+" "+x.en+" "+x.d).toLowerCase().includes(query));

document.getElementById("grid").innerHTML=list.map(x=>{
let i=calculators.indexOf(x);
return `<div class="card">
<h3>${language==="ar"?x.ar:x.en}</h3>
<p>${x.d}</p>
${x.f.map(f=>`<div class="field">
<label>${f[language==="ar"?1:2]}</label>
<input type="number" step="any" id="input-${i}-${f[0]}" value="${f[3]}">
</div>`).join("")}
<button class="calc" onclick="calculate(${i})">${language==="ar"?"احسب الآن":"Calculate"}</button>
<div class="result" id="result-${i}"></div>
</div>`;
}).join("")||"<p>لا توجد نتائج</p>";
}

function calculate(i){
let x=calculators[i],v={},valid=true;
x.f.forEach(f=>{
let el=document.getElementById("input-"+i+"-"+f[0]);
v[f[0]]=Number(el.value);
if(el.value.trim()===""||!Number.isFinite(v[f[0]]))valid=false;
});
let result=document.getElementById("result-"+i);
result.style.display="block";
if(!valid){result.textContent=language==="ar"?"أدخل جميع القيم بشكل صحيح":"Enter valid values";return;}
let output;
try{output=x.fn(v)}catch(e){output="Error"}
if(typeof output==="number")output=Number.isFinite(output)?output.toLocaleString("en-US",{maximumFractionDigits:2}):"راجع القيم المدخلة";
result.textContent=(language==="ar"?"النتيجة: ":"Result: ")+output;
}

function setCategory(c){category=c;render()}
function toggleLanguage(){language=language==="ar"?"en":"ar";render()}
render();
</script>
</body>
</html>
